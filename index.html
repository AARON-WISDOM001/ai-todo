<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1ece5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <title>AI Todo — a task manager that understands what you say</title>
    <meta
      name="description"
      content="AI Todo turns plain-language instructions into structured tasks, breaks large goals into actionable steps, and tells you what to work on next. Every AI suggestion is reviewed before it is saved."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2d2928" />
    <link rel="canonical" href="https://ai-todo-henna-psi.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Todo" />
    <meta property="og:url" content="https://ai-todo-henna-psi.vercel.app/" />
    <meta property="og:title" content="AI Todo — a task manager that understands what you say" />
    <meta
      property="og:description"
      content="Describe a task in your own words and AI Todo structures it. Review every suggestion before it is saved."
    />
    <meta property="og:image" content="/favicon.svg" />
    <meta name="twitter:card" content="summary" />

    <!--
      Applies the stored theme before first paint. This has to be inline and
      synchronous: anything deferred to a module or a React effect runs after
      the browser has already painted the light theme, which is exactly the
      white flash a dark-mode user notices most. It duplicates the storage key
      and the resolve rule from src/lib/theme.tsx — the one place duplication is
      warranted, because correctness here costs one line of drift risk.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('ai-todo:theme:v1')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        <h1>AI Todo</h1>
        <p>This task manager needs JavaScript enabled to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
